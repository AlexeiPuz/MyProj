<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <link rel="icon" href="icon.ico">
    <title>Регистрация</title>
</head>
<body>
    <main>
        <section class="reg">
            <h2>Регистрация на сайте</h2>
            <form id="order-form" action="">
                <div class="field">
                    <input class="input" name="fullname" id="fullname" type="text" placeholder="Фамилия и имя" required>
                </div>
                <div class="field">
                    <input class="input" name="phone" id="phone" type="text" placeholder="Телефон" required>
                </div>
                <div class="field">
                    <input class="input" name="email" id="email" type="text" placeholder="Электронная почта" required>
                </div>
                <div class="field">
                    <label for="noPhone">Не звонить!</label>
                    <input class="checkbox" name="noPhone" id="noPhone" type="checkbox">
                </div>
                <div class="field">
                    <button onclick="window.location.href = 'index.html'">Зарегистрироваться</button>
                </div>
            </form>
        </section>
    </main>
</body>
</html>
